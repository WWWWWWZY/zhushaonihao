<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>系统提示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        
        .popup {
            position: absolute;
            width: 280px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 20px;
            z-index: 1000;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes popIn {
            0% {
                transform: scale(0.5) rotate(-5deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        
        .popup-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .popup-icon {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            font-size: 20px;
        }
        
        .popup-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .popup-close {
            margin-left: auto;
            width: 20px;
            height: 20px;
            border: none;
            background: #eee;
            border-radius: 50%;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        
        .popup-close:active {
            background: #ddd;
        }
        
        .popup-content {
            background: #00C853;
            color: white;
            padding: 30px 20px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .popup-button {
            width: 100%;
            padding: 12px;
            background: #00C853;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .popup-button:active {
            background: #00A844;
        }
        
        .final-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 10000;
            display: none;
            animation: popIn 0.5s ease-out;
        }
        
        .final-message h1 {
            font-size: 36px;
            color: #00C853;
            margin-bottom: 20px;
        }
        
        .final-message p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .final-button {
            padding: 15px 50px;
            background: linear-gradient(135deg, #00C853, #00A844);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 200, 83, 0.3);
        }
        
        .final-button:active {
            transform: scale(0.95);
        }
        
        .counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="counter" id="counter">窗口数: 1</div>
    <div class="final-message" id="finalMessage">
        <h1>🎉 恭喜过关！</h1>
        <p>你成功关闭了所有窗口！<br>看来你不是傻子嘛~</p>
        <button class="final-button" onclick="closeAll()">关闭页面</button>
    </div>

    <script>
        let popupCount = 0;
        let totalPopups = 0;
        const maxPopups = 20; // 最多20个窗口
        let popupInterval;
        const messages = ['你是傻子', '你真的是傻子', '你就是个傻子', '傻子你好', '傻傻的你'];
        
        function createPopup() {
            if (totalPopups >= maxPopups) {
                return;
            }
            
            const popup = document.createElement('div');
            popup.className = 'popup';
            
            // 随机位置（确保在屏幕范围内）
            const maxX = window.innerWidth - 300;
            const maxY = window.innerHeight - 250;
            const x = Math.random() * Math.max(20, maxX);
            const y = Math.random() * Math.max(20, maxY);
            
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
            
            // 随机旋转角度
            const rotation = (Math.random() - 0.5) * 10;
            popup.style.transform = `rotate(${rotation}deg)`;
            
            // 随机消息
            const message = messages[Math.floor(Math.random() * messages.length)];
            
            popup.innerHTML = `
                <div class="popup-header">
                    <span class="popup-icon">⚠️</span>
                    <span class="popup-title">系统提示</span>
                    <button class="popup-close" onclick="closePopup(this)">✕</button>
                </div>
                <div class="popup-content">${message}</div>
                <button class="popup-button" onclick="tryClose(this)">确定</button>
            `;
            
            document.body.appendChild(popup);
            popupCount++;
            totalPopups++;
            updateCounter();
            
            // 添加触摸防护
            popup.addEventListener('touchstart', (e) => {
                e.stopPropagation();
            });
        }
        
        function closePopup(btn) {
            // 关闭一个，弹出两个！
            const popup = btn.closest('.popup');
            
            // 震动效果
            popup.style.animation = 'shake 0.3s ease-in-out';
            
            setTimeout(() => {
                popup.remove();
                popupCount--;
                updateCounter();
                
                // 弹出两个新的
                if (totalPopups < maxPopups) {
                    createPopup();
                    setTimeout(() => {
                        if (totalPopups < maxPopups) {
                            createPopup();
                        }
                    }, 200);
                }
                
                checkGameOver();
            }, 300);
        }
        
        function tryClose(btn) {
            // 点击确定按钮也会弹出新的
            const popup = btn.closest('.popup');
            popup.style.animation = 'shake 0.3s ease-in-out';
            
            setTimeout(() => {
                popup.remove();
                popupCount--;
                updateCounter();
                
                if (totalPopups < maxPopups) {
                    createPopup();
                }
                
                checkGameOver();
            }, 300);
        }
        
        function updateCounter() {
            document.getElementById('counter').textContent = `窗口数: ${popupCount}`;
        }
        
        function checkGameOver() {
            if (popupCount === 0 && totalPopups >= maxPopups) {
                // 全部关完了
                setTimeout(() => {
                    document.getElementById('finalMessage').style.display = 'block';
                }, 500);
            }
        }
        
        function closeAll() {
            if (typeof WeixinJSBridge !== 'undefined') {
                WeixinJSBridge.call('closeWindow');
            } else {
                window.close();
                setTimeout(() => {
                    window.location.href = 'about:blank';
                }, 100);
            }
        }
        
        // 添加震动动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0) rotate(0deg); }
                25% { transform: translateX(-10px) rotate(-5deg); }
                75% { transform: translateX(10px) rotate(5deg); }
            }
        `;
        document.head.appendChild(style);
        
        // 页面加载后立即开始
        window.addEventListener('load', () => {
            // 先弹一个
            createPopup();
            
            // 每2秒自动弹一个新的（在达到上限前）
            popupInterval = setInterval(() => {
                if (totalPopups < maxPopups && popupCount > 0) {
                    createPopup();
                }
            }, 2000);
        });
        
        // 防止退出
        window.addEventListener('beforeunload', (e) => {
            if (popupCount > 0) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });
        
        // 阻止微信侧滑返回
        let startX = 0;
        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        }, { passive: false });
        
        document.addEventListener('touchmove', (e) => {
            const currentX = e.touches[0].clientX;
            if (startX < 50 && currentX > startX + 50 && popupCount > 0) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
